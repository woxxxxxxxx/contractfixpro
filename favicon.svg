<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- White base -->
  <rect width="32" height="32" fill="white"/>
  <!-- Blue rounded background -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#2563eb"/>
  <!-- Document body with dog-ear top-right corner -->
  <polygon points="8,6 18,6 22,10 22,25 8,25" fill="white"/>
  <!-- Dog-ear fold (light blue tint) -->
  <polygon points="18,6 22,6 22,10" fill="#dbeafe"/>
  <!-- Fold crease lines -->
  <polyline points="18,6 18,10 22,10" fill="none" stroke="#93c5fd" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Text lines on document -->
  <rect x="10" y="12" width="7.5" height="1.4" rx="0.7" fill="#bfdbfe"/>
  <rect x="10" y="15" width="7.5" height="1.4" rx="0.7" fill="#bfdbfe"/>
  <rect x="10" y="18" width="5"   height="1.4" rx="0.7" fill="#bfdbfe"/>
  <!-- Gold seal badge (overlaps bottom-right of document) -->
  <circle cx="20" cy="23" r="4"   fill="#d97706"/>
  <circle cx="20" cy="23" r="3.2" fill="#fbbf24"/>
  <!-- White checkmark inside badge -->
  <polyline points="18.1,23 19.6,24.7 22.2,21.3"
    fill="none" stroke="white" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
